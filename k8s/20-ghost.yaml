apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghost
  namespace: ghost
  labels:
    app: ghost
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ghost
  # RollingUpdate is the default, but stated explicitly here because the
  # rolling-update demo is a headline talking point: maxUnavailable 0 means
  # no pod is torn down until its replacement is Ready — zero downtime.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ghost
    spec:
      containers:
        - name: ghost
          image: ghost:5-alpine
          ports:
            - containerPort: 2368
          env:
            - name: database__client
              value: mysql
            - name: database__connection__host
              value: mysql
            - name: database__connection__user
              value: root
            - name: database__connection__password
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: database__connection__database
              value: ghost
            # Ghost needs to know its own public URL. Filled in during the
            # build once the ALB DNS name is known (see runbook step 7).
            - name: url
              value: "http://REPLACE_WITH_ALB_DNS"
          readinessProbe:
            httpGet:
              path: /
              port: 2368
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 2368
            initialDelaySeconds: 60
            periodSeconds: 20
          # CPU request is what the HPA measures utilisation against — required
          # for HorizontalPodAutoscaler to function.
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: ghost
  namespace: ghost
  labels:
    app: ghost
spec:
  type: ClusterIP
  selector:
    app: ghost
  ports:
    - port: 80
      targetPort: 2368
