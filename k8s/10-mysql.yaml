apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: ghost
type: Opaque
stringData:
  # Placeholders only. Real credentials are supplied at apply time or pulled
  # from an external secrets manager — they are never committed to git.
  MYSQL_ROOT_PASSWORD: "CHANGE_ME_ROOT"
  MYSQL_DATABASE: "ghost"
  MYSQL_USER: "ghost"
  MYSQL_PASSWORD: "CHANGE_ME_USER"
---
# Headless service (clusterIP: None) gives the StatefulSet pod a stable DNS
# name: mysql-0.mysql.ghost.svc.cluster.local. Ghost connects via the plain
# service name "mysql".
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: ghost
  labels:
    app: mysql
spec:
  clusterIP: None
  selector:
    app: mysql
  ports:
    - port: 3306
      name: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: ghost
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
              name: mysql
          envFrom:
            - secretRef:
                name: mysql-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -u root -p$MYSQL_ROOT_PASSWORD"]
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -u root -p$MYSQL_ROOT_PASSWORD"]
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              memory: "1Gi"
  # volumeClaimTemplates is what makes this stateful: the EBS CSI driver
  # provisions a dedicated EBS volume for the pod and reattaches it on restart.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp2
        resources:
          requests:
            storage: 8Gi
